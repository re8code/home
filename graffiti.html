  <main class="pt-16">
    <section class="mx-auto max-w-4xl px-6 lg:px-8 py-16">

      <!-- ===== Breadcrumb ===== -->
      <div class="flex items-center gap-2 text-xs text-slate-500">
        <a href="index.html" class="inline-flex items-center gap-1 hover:text-slate-800 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-3.5 w-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10" /></svg>
          홈
        </a>
        <span>/</span>
        <span class="text-slate-600">원장님의 낙서</span>
      </div>

      <div class="mt-4 flex items-center justify-between gap-4">
        <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 tracking-tight">원장님의 낙서</h1>
        <a href="graffiti-new.html" class="shrink-0 inline-flex items-center gap-1.5 rounded-full bg-brand-500 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-brand-400 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>

      <p class="mt-3 text-slate-600 leading-relaxed">
        원장님 개똥 철학으로 혼자서 끄적거리는 낙서장입니다.
      </p>

      <div class="mt-8 border-t border-slate-900/10"></div>

      <!-- ===== Search ===== -->
      <div class="mt-6 relative">
        <input
          id="search-input"
          type="text"
          placeholder="검색어 입력"
          class="w-full rounded-full border border-slate-900/10 bg-white pl-5 pr-11 py-3 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-500/50"
        />
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="absolute right-4 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400">
          <circle cx="11" cy="11" r="7" /><path stroke-linecap="round" d="M21 21l-4.3-4.3" />
        </svg>
      </div>

      <p class="mt-5 text-xs font-mono text-slate-500">전체 <span id="total-count" class="text-brand-600">0</span>건</p>

      <!-- ===== List ===== -->
      <div id="post-list" class="mt-4 space-y-3"></div>
      <p id="empty-state" class="hidden mt-16 text-center text-sm text-slate-500"></p>

      <!-- ===== Pagination ===== -->
      <div id="pagination" class="mt-10 flex items-center justify-center gap-1.5 font-mono text-sm"></div>

    </section>

  <!-- ===== Footer ===== -->
  <footer class="border-t border-slate-900/10">
    <div class="mx-auto max-w-7xl px-6 lg:px-8 py-10 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2 font-mono text-sm text-slate-600">
        <span class="inline-flex h-6 w-6 items-center justify-center rounded-md bg-brand-500/15 text-brand-600 border border-brand-500/30 text-xs">R/</span>
        Recode Coding
      </div>
      <p class="text-xs text-slate-500">© 2026 Recode Coding. AI시대 프로그래밍 연구소.</p>
    </div>
  </footer>

  <script type="module">
    import { fetchPosts } from './assets/js/firebase-client.js';

    const PAGE_SIZE = 10;
    let currentPage = 1;
    let allPosts = [];
    let filteredPosts = [];
    let fetchFailed = false;

    const listEl = document.getElementById('post-list');
    const paginationEl = document.getElementById('pagination');
    const emptyStateEl = document.getElementById('empty-state');
    const totalCountEl = document.getElementById('total-count');
    const searchInput = document.getElementById('search-input');

    function render() {
      totalCountEl.textContent = filteredPosts.length;
      emptyStateEl.classList.toggle('hidden', filteredPosts.length > 0);
      if (filteredPosts.length === 0) {
        emptyStateEl.textContent = fetchFailed
          ? '게시글을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.'
          : searchInput.value.trim()
            ? '검색 결과가 없습니다.'
            : '아직 등록된 글이 없습니다.';
      }

      const totalPages = Math.max(1, Math.ceil(filteredPosts.length / PAGE_SIZE));
      currentPage = Math.min(currentPage, totalPages);

      const start = (currentPage - 1) * PAGE_SIZE;
      const pagePosts = filteredPosts.slice(start, start + PAGE_SIZE);

      listEl.innerHTML = pagePosts
        .map(
          (post) => `
        <a href="graffiti-detail.html?id=${post.id}" class="card-hover flex items-center gap-4 rounded-2xl border border-slate-900/10 bg-white px-5 py-4">
          <span class="font-mono text-sm text-brand-600 w-8 shrink-0">${post.id}</span>
          <span class="flex-1 min-w-0 truncate text-slate-800 font-medium">${post.title}</span>
          <span class="shrink-0 text-xs text-slate-500 font-mono hidden sm:inline">조회 ${post.views}</span>
          <span class="shrink-0 text-xs text-slate-500 font-mono">${post.date}</span>
        </a>`
        )
        .join('');

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const groupSize = 5;
      const groupStart = Math.floor((currentPage - 1) / groupSize) * groupSize + 1;
      const groupEnd = Math.min(groupStart + groupSize - 1, totalPages);

      let html = '';
      html += pageButton('«', Math.max(1, groupStart - groupSize), groupStart === 1);
      html += pageButton('‹', Math.max(1, currentPage - 1), currentPage === 1);
      for (let p = groupStart; p <= groupEnd; p++) {
        html += `<button data-page="${p}" class="page-btn h-8 w-8 rounded-full ${
          p === currentPage ? 'bg-brand-500 text-slate-950 font-semibold' : 'text-slate-500 hover:text-slate-900 hover:bg-slate-900/5'
        }">${p}</button>`;
      }
      html += pageButton('›', Math.min(totalPages, currentPage + 1), currentPage === totalPages);
      html += pageButton('»', Math.min(totalPages, groupEnd + 1), groupEnd === totalPages);

      paginationEl.innerHTML = html;
      paginationEl.querySelectorAll('.page-btn[data-page]').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentPage = Number(btn.dataset.page);
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    function pageButton(label, targetPage, disabled) {
      return `<button data-page="${targetPage}" class="page-btn h-8 w-8 rounded-full text-slate-400 hover:text-slate-900 hover:bg-slate-900/5 ${
        disabled ? 'opacity-30 pointer-events-none' : ''
      }">${label}</button>`;
    }

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      filteredPosts = allPosts.filter((post) => post.title.toLowerCase().includes(q));
      currentPage = 1;
      render();
    });

    async function init() {
      const remote = await fetchPosts();
      fetchFailed = remote === null;
      allPosts = (remote || []).slice().sort((a, b) => b.id - a.id);
      filteredPosts = allPosts;
      render();
    }

    init();
  </script>

  <script src="assets/js/mobile-menu.js" defer></script>
