      <h1 class="mt-4 text-3xl sm:text-4xl font-bold text-slate-900 tracking-tight">새로운 낙서 작성</h1>

      <form id="new-post-form" class="mt-8 space-y-5">
        <div>
          <label for="title-input" class="block text-sm font-semibold text-slate-700">제목</label>
          <input
            id="title-input"
            type="text"
            placeholder="제목을 입력하세요"
            class="mt-2 w-full rounded-xl border border-slate-900/10 bg-white px-4 py-3 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-500/50"
          />
        </div>
        <div>
          <label for="content-input" class="block text-sm font-semibold text-slate-700">내용</label>
          <textarea
            id="content-input"
            rows="12"
            placeholder="내용을 입력하세요"
            class="mt-2 w-full rounded-xl border border-slate-900/10 bg-white px-4 py-3 text-sm leading-relaxed text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-500/50"
          ></textarea>
        </div>

        <p id="form-error" class="hidden text-sm text-red-500"></p>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancel-btn" class="rounded-full border border-slate-900/15 px-6 py-3 text-sm font-semibold text-slate-800 hover:border-slate-900/30 hover:bg-slate-900/5 transition-colors">취소</button>

  <script type="module">
    import { fetchPosts, createPost } from '../assets/js/firebase-client.js';
    import { requestAdminPassword } from '../assets/js/admin-auth.js';

    const formEl = document.getElementById('new-post-form');
    const titleInput = document.getElementById('title-input');
    const contentInput = document.getElementById('content-input');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }

    cancelBtn.addEventListener('click', () => {
      window.location.href = 'graffiti.html';
    });

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();

      if (!title || !content) {
        showError('제목과 내용을 모두 입력해주세요.');
        return;
      }

      errorEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = '등록 중...';

      const remote = await fetchPosts();
      if (remote === null) {
        submitBtn.disabled = false;
        submitBtn.textContent = '등록';
        showError('게시글 목록을 불러오지 못해 등록할 수 없습니다. 새로고침 후 다시 시도해주세요.');
        return;
      }

      const nextId = Math.max(0, ...remote.map((p) => p.id)) + 1;
      const today = new Date().toISOString().slice(0, 10);

      const newDocId = await createPost({ id: nextId, title, content, date: today, views: 0 });

      if (newDocId) {
        window.location.href = `graffiti-detail.html?id=${nextId}`;
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = '등록';
        showError('게시글 저장에 실패했습니다. 잠시 후 다시 시도해주세요.');
      }
    });

    async function guard() {
      const ok = await requestAdminPassword('글 작성');
      if (!ok) {
        window.location.href = 'graffiti.html';
      }
    }

    guard();
  </script>
